name: backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Neçə ay"
        default: "12"
      spread:
        description: "Spread (qiymət dolları)"
        default: "0.30"
      script:
        description: "Skript: bt_compare.py və ya bt.py"
        default: "bt_compare.py"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy matplotlib
      - name: backtest
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MONTHS: ${{ github.event.inputs.months }}
          SPREAD: ${{ github.event.inputs.spread }}
          SCRIPT: ${{ github.event.inputs.script }}
        run: python "$SCRIPT"
